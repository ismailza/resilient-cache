name: Release

# Dispatch from main with the version to cut. The pom keeps a snapshot `revision`;
# the version is passed on the command line, so a release needs no bump commit.
# It deploys first and tags only once the deploy succeeded: GitHub Packages refuses
# to overwrite a version, so a failed run is retried, a published one never is.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (a leading "v" is stripped)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a branch other than main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Dispatch the release from main, not '${{ github.ref_name }}'."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Full history and tags: the notes are built from the commits since the last tag.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$INPUT_VERSION' is not a valid version (expected e.g. 0.2.0)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists — pick a new version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          set -euo pipefail
          if LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            RANGE="$LAST..HEAD"
          else
            RANGE="HEAD"
          fi
          node .github/scripts/release-notes.mjs --range="$RANGE" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # The tests run as part of the deploy: what is published is what was tested.
      - name: Deploy to GitHub Packages
        run: ./mvnw -B -ntp deploy -Drevision="${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
